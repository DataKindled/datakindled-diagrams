<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cross-validation results · Applied ML on Snowflake · DataKindled</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Playfair+Display:wght@400&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  html, body { background: transparent; }
  body { margin: 0; padding: 2px 2px 6px; font-family: Inter, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; color: #1A1A1A; }
  table { width: 100%; border-collapse: separate; border-spacing: 0; table-layout: fixed; background: #FFFFFF; border: 1px solid #E8E4DC; border-radius: 10px; overflow: hidden; }
  th, td { padding: 13px 16px; text-align: left; vertical-align: top; font-size: 14.5px; line-height: 1.5; border-bottom: 1px solid #E8E4DC; }
  tbody tr:last-child th, tbody tr:last-child td { border-bottom: none; }
  thead th { background: #1A1A1A; color: #FAFAF8; border-bottom: none; font-family: "Playfair Display", Georgia, "Times New Roman", serif; font-size: 17px; font-weight: 400; line-height: 1.25; }
  tbody th { font-weight: 500; background: #FAFAF8; border-right: 1px solid #E8E4DC; }
  td.dk-n, th.dk-n { text-align: right; font-variant-numeric: tabular-nums; }
  tr.dk-win th, tr.dk-win td { background: #FAECE7; }
  tr.dk-win th, tr.dk-win td.dk-val { color: #C1440E; }
  td.dk-val { font-weight: 500; }
  td.dk-gap { color: #888780; }
  .dk-sub { display: block; margin-top: 2px; font-size: 12px; font-weight: 400; color: #888780; }
  tr.dk-win .dk-sub { color: #C1440E; }
  code { font-family: "SFMono-Regular", Menlo, Consolas, "DejaVu Sans Mono", monospace; font-size: 12.5px; background: #FFFFFF; border: 1px solid #E8E4DC; border-radius: 4px; padding: 1px 5px; white-space: nowrap; }
  td code { display: inline-block; margin: 0 4px 4px 0; }
  @media (max-width: 640px) {
    th, td { padding: 10px 9px; font-size: 13px; }
    thead th { font-size: 14.5px; }
    col.dk-n { width: 76px !important; }
    thead th { font-size: 13px; }
  }
  .dk-vars-s { display: none; }
  @media (max-width: 640px) { .dk-vars-s { display: block; margin-top: 6px; } .dk-vars-s code { font-size: 11px; margin: 0 3px 3px 0; display: inline-block; } }
</style>
</head>
<body>
<table>
  <colgroup><col><col class="dk-n" style="width:200px"><col class="dk-n" style="width:210px"><col class="dk-n" style="width:110px"></colgroup>
  <thead>
    <tr><th>Model</th><th class="dk-n">AUC, training folds</th><th class="dk-n">AUC, validation folds</th><th class="dk-n">Gap</th></tr>
  </thead>
  <tbody>
    <tr class="dk-win"><th>Logistic regression<span class="dk-sub">Chosen: highest validation AUC, smallest gap</span></th><td class="dk-n">0.771</td><td class="dk-n dk-val">0.739</td><td class="dk-n dk-gap">0.032</td></tr>
    <tr><th>XGBoost, default settings<span class="dk-sub">Overfitted</span></th><td class="dk-n">0.993</td><td class="dk-n">0.668</td><td class="dk-n dk-gap">0.325</td></tr>
    <tr><th>XGBoost, smaller trees<span class="dk-sub">Tuned hyperparameters</span></th><td class="dk-n">0.899</td><td class="dk-n">0.713</td><td class="dk-n dk-gap">0.186</td></tr>
  </tbody>
</table>
<script>
  // Tells the lesson page this table's height, so an embed that listens can size the frame to fit.
  (function () {
    function send() {
      var h = Math.ceil(document.body.getBoundingClientRect().height) + 8;
      parent.postMessage({ dkFrame: "module4-cv-table", dkHeight: h }, "*");
    }
    window.addEventListener("load", send);
    window.addEventListener("resize", send);
  })();
</script>
</body>
</html>
